# ferropipe-rdp CI.
#
# The crate depends on a sibling checkout through a path dependency:
#   ferropipe-rdp/Cargo.toml -> rdpeudp = { path = "../rdpeudp" }
# so the job checks both repositories out side by side under the workspace
# (ferropipe-rdp/, rdpeudp/) and runs cargo from ferropipe-rdp/. rdpeudp is
# taken at the branch this run is for when it has one of that name (so a
# feature branch spanning both repositories builds against itself), else at
# its default branch. It must exist on GitHub before this workflow can pass;
# if it is private, put a token with read access into its clone URL
# (`https://x-access-token:${{ secrets.SIBLING_TOKEN }}@github.com/...`).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out ferropipe-rdp
        uses: actions/checkout@v4
        with:
          path: ferropipe-rdp

      - name: Check out rdpeudp (same branch if it exists, else default)
        env: { BRANCH: "${{ github.head_ref || github.ref_name }}" }
        run: |
          git clone --depth 1 https://github.com/nicatmhmmdv/rdpeudp.git rdpeudp
          git -C rdpeudp fetch --depth 1 origin "$BRANCH" && git -C rdpeudp checkout FETCH_HEAD || echo "rdpeudp: no branch $BRANCH, using default"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferropipe-rdp

      - name: cargo build
        working-directory: ferropipe-rdp
        run: cargo build --locked

      - name: cargo test (all features, incl. the egui keymap bridge)
        working-directory: ferropipe-rdp
        run: cargo test --locked --all-features

      - name: cargo clippy
        working-directory: ferropipe-rdp
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # The crate as a whole is not rustfmt-clean (the protocol modules predate
      # the formatting rule), so only the keymap files are checked for now.
      # Widen this list as modules are formatted.
      - name: rustfmt (keymap only)
        working-directory: ferropipe-rdp
        run: rustfmt --edition 2021 --check src/keymap.rs src/keymap/egui.rs

  # Advisory only: a new RustSec advisory should not block a merge, but it
  # should be visible on the run.
  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # cargo-audit only reads Cargo.lock, so rdpeudp is not needed and the
      # repository can sit at the workspace root, where the action looks.
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
